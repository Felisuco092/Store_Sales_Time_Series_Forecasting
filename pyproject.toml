[project]
name = "store-sales-time-series-forecasting"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # API
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    
    # Descarga del modelo
    "huggingface-hub>=1.28.0",
    
    # Inferencia ML
    "joblib==1.5.3",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "statsmodels==0.14.6",
    "xgboost==3.2.0",
]

[tool.fastapi]
entrypoint = "api.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    
    # Jupyter & Notebooks
    "ipykernel==7.3.0",
    "ipython==8.39.0",
    "ipywidgets==8.1.8",
    "jupyter-client==8.9.1",
    "jupyter-core==5.9.1",
    "jupyterlab-widgets==3.0.16",
    "widgetsnbextension==4.0.15",
    "debugpy==1.8.21",

    # Visualización
    "matplotlib==3.10.9",
    "seaborn==0.13.2",

    # Kaggle downloads
    "kagglehub==1.0.2",
    "kagglesdk==0.1.28",
]